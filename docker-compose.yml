services:
  collector:
    build: .
    command: ["/usr/local/bin/script.sh"]
    volumes:
      - reports:/var/www
      - /var/log:/var/log:ro

  viewer:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - reports:/usr/share/nginx/html:ro
    depends_on:
      - collector

volumes:
  reports:
